name: Java CI with Gradle

on:
  push:
    branches: [ "26.1", "LTS/1.21.11" ]
  pull_request:
    branches: [ "26.1", "LTS/1.21.11" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Только для пушей, не для PR
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # Tests are skipped (-x test) because they require a Fabric environment 
      # that is not fully initialized in this headless CI setup.
      run: ./gradlew build -x test

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
        MC=$(grep 'minecraft_version_out' gradle.properties | cut -d'=' -f2 | xargs)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "mc=${MC}" >> $GITHUB_OUTPUT
        echo "tag=${MC}-${VERSION}-build${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Build ${{ steps.get_version.outputs.tag }}
        files: build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tweakeroo-fabric-artifacts
        path: build/libs/
